name: SEO Freshness Update
description: Automated hourly SEO content rotation, schema updates, and sitemap generation

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-update:
    name: Hourly SEO freshness update
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref_name == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run fresh-data.js
        id: fresh_data
        run: |
          echo "=== Running fresh-data.js ===" 
          node scripts/fresh-data.js
          echo "fresh_data_done=true" >> $GITHUB_OUTPUT

      - name: Run update-schema.js
        id: update_schema
        run: |
          echo "=== Running update-schema.js ===" 
          node scripts/update-schema.js
          echo "update_schema_done=true" >> $GITHUB_OUTPUT

      - name: Run generate-sitemap.js
        id: generate_sitemap
        run: |
          echo "=== Running generate-sitemap.js ===" 
          node scripts/generate-sitemap.js
          echo "generate_sitemap_done=true" >> $GITHUB_OUTPUT

      - name: Run notify-indexing.js
        id: notify_indexing
        run: |
          echo "=== Running notify-indexing.js ===" 
          node scripts/notify-indexing.js
          echo "notify_indexing_done=true" >> $GITHUB_OUTPUT
        continue-on-error: true   # notification failures should not block commits

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "📋 No file changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ File changes detected - will commit"
            git diff --name-only
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        id: commit_push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore(seo): hourly freshness update [skip ci]"
          git push
          echo "commit_success=true" >> $GITHUB_OUTPUT
          echo "✅ Changes committed and pushed successfully"

      - name: Summary - No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "📊 SEO Update Summary"
          echo "===================="
          echo "✅ Fresh Data:      ${{ steps.fresh_data.outputs.fresh_data_done }}"
          echo "✅ Update Schema:   ${{ steps.update_schema.outputs.update_schema_done }}"
          echo "✅ Generate Sitemap: ${{ steps.generate_sitemap.outputs.generate_sitemap_done }}"
          echo "✅ Notify Indexing:  ${{ steps.notify_indexing.outputs.notify_indexing_done }}"
          echo "===================="
          echo "📝 Result: No changes to commit (content remained the same)"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Summary - Changes committed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "📊 SEO Update Summary"
          echo "===================="
          echo "✅ Fresh Data:      ${{ steps.fresh_data.outputs.fresh_data_done }}"
          echo "✅ Update Schema:   ${{ steps.update_schema.outputs.update_schema_done }}"
          echo "✅ Generate Sitemap: ${{ steps.generate_sitemap.outputs.generate_sitemap_done }}"
          echo "✅ Notify Indexing:  ${{ steps.notify_indexing.outputs.notify_indexing_done }}"
          echo "===================="
          echo "✅ Result: Changes committed and pushed to main branch"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

  workflow-status:
    runs-on: ubuntu-latest
    needs: seo-update
    if: always()
    
    steps:
      - name: Workflow completed
        run: |
          if [ "${{ needs.seo-update.result }}" = "success" ]; then
            echo "✅ SEO Freshness Update completed successfully"
            echo "🕐 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "📍 Repository: progressiveinsurancebillpay"
            echo "🔗 Next scheduled run: in 1 hour (top of hour, UTC)"
          else
            echo "❌ SEO Freshness Update failed"
            echo "⚠️  Check workflow logs for details"
          fi
